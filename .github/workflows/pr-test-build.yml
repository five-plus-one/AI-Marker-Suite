name: PR Temporary Build

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - name: Build temporary script
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_ID: ${{ github.run_id }}
        run: npm run build -- --channel=prtest --pr="$PR_NUMBER" --build="$BUILD_ID"
      - run: npm run verify:bundle
      - run: npm run verify:browser
      - name: Record PR identity
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.id }}
        run: node -e "require('fs').writeFileSync('pr-identity.json', JSON.stringify({pr:Number(process.env.PR_NUMBER),sha:process.env.HEAD_SHA,repository:Number(process.env.HEAD_REPOSITORY)}))"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-temporary-script
          path: |
            dist/ai_marker.user.js
            pr-identity.json
          retention-days: 7
