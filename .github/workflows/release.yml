name: Release

# 推送 v* tag 时自动创建 GitHub Release
# 用法：git tag v1.21.10.0 && git push origin v1.21.10.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 守门 1：tag 必须与 config.js 的 VERSION 一致
      - name: Verify tag matches config.js VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONFIG_VERSION=$(node -e "const s=require('fs').readFileSync('src/core/config.js','utf8'); console.log(s.match(/VERSION\s*:\s*'([^']+)'/)[1])")
          echo "tag 版本: $TAG_VERSION / config.js VERSION: $CONFIG_VERSION"
          if [ "$TAG_VERSION" != "$CONFIG_VERSION" ]; then
            echo "::error::tag ($TAG_VERSION) 与 config.js VERSION ($CONFIG_VERSION) 不一致，请修正后重新打 tag"
            exit 1
          fi

      - name: Test release commit
        run: npm test

      - name: Build (stable channel)
        run: npm run build -- --channel=stable

      - name: Verify bundled platform registration
        run: npm run verify:bundle

      # 守门 2：构建产物版本必须与 tag 一致
      - name: Verify built manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BUILT_VERSION=$(node -p "require('./dist/manifest.json').version")
          echo "构建产物版本: $BUILT_VERSION"
          if [ "$BUILT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::构建产物版本 ($BUILT_VERSION) 与 tag ($TAG_VERSION) 不一致"
            exit 1
          fi

      # 从 manifest.json 提取当前版本的更新日志，按分类生成 Release 说明
      # 注意：文案禁止裸 @xxx（GitHub 会解析为用户提及，如 @match 曾误标无关用户），
      # 生成后统一消毒为全角 ＠，双保险
      - name: Generate release notes
        run: |
          node -e "
            const m = require('./dist/manifest.json');
            const keys = Object.keys(m.changelog).sort((a, b) => b.localeCompare(a, 'en', { numeric: true }));
            const version = keys[0] || '${GITHUB_REF_NAME#v}';
            const items = m.changelog[version] || [];

            // 分类
            const categories = [
              { tag: '新平台', emoji: '🆕', label: '新平台' },
              { tag: '新功能', emoji: '✨', label: '新功能' },
              { tag: '优化',   emoji: '⚡', label: '优化' },
              { tag: '修复',   emoji: '🔧', label: '修复' },
              { tag: '文档',   emoji: '📝', label: '文档' },
            ];

            const grouped = {};
            const other = [];
            items.forEach(item => {
              const match = item.match(/^【(.+?)】(.+)/);
              if (match) {
                const tag = match[1];
                const text = match[2].trim();
                (grouped[tag] = grouped[tag] || []).push(text);
              } else {
                other.push(item);
              }
            });

            const sections = categories
              .filter(c => grouped[c.tag]?.length)
              .map(c => [
                '### ' + c.emoji + ' ' + c.label,
                ...grouped[c.tag].map(i => '- ' + i),
              ].join('\n'));

            if (other.length) {
              sections.push('### 📌 其他\n' + other.map(i => '- ' + i).join('\n'));
            }

            const body = [
              '<div align=\"center\">',
              '',
              '# 🚀 AI 批改助手 v' + version,
              '',
              '**[📖 文档站](https://aimarking.five-plus-one.com/)** · ',
              '**[⚡ 一键安装（稳定版）](https://auto-update.aimarking.five-plus-one.com/ota/ai_marker.user.js)** · ',
              '**[🔮 一键安装（预览版）](https://auto-update.aimarking.five-plus-one.com/ota/preview/ai_marker.user.js)**',
              '',
              '确保您已安装 [Tampermonkey](https://www.tampermonkey.net/) 扩展',
              '',
              '</div>',
              '',
              '---',
              '',
              '## 📋 更新内容',
              '',
              sections.join('\n\n'),
              '',
              '---',
              '',
              '| 链接 | 说明 |',
              '|------|------|',
              '| [📖 文档站](https://aimarking.five-plus-one.com/) | 完整使用文档与平台说明 |',
              '| [📝 完整更新日志](https://aimarking.five-plus-one.com/changelog) | 所有版本更新记录 |',
              '| [⚡ 稳定版安装](https://auto-update.aimarking.five-plus-one.com/ota/ai_marker.user.js) | 推荐，经过充分测试 |',
              '| [🔮 预览版安装](https://auto-update.aimarking.five-plus-one.com/ota/preview/ai_marker.user.js) | 功能较新，提前体验 |',
              '',
              '---',
              '',
              '**推荐浏览器**: Microsoft Edge + Tampermonkey',
            ].join('\n');

            // 消毒：@xxx 会被 GitHub 解析为用户提及（@match 曾误标无关用户为贡献者），转全角 ＠
            const safeBody = body.replace(/@([A-Za-z][A-Za-z0-9_-]*)/g, '＠\$1');
            require('fs').writeFileSync('RELEASE_NOTES.md', safeBody);
          "
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --generate-notes \
            dist/ai_marker.user.js

      # --generate-notes 会把历史提交标题拉进说明（可能含 @match 等脚本头关键字，
      # 被 GitHub 解析为用户提及），且这部分不受正文消毒覆盖——发布后二次消毒。
      # 只杀脚本头关键字类误提及，真实贡献者归属（@用户名）保留（#240 回归修复）
      - name: Sanitize generated notes (防脚本头关键字误提及)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > NOTES_IN.md
          node -e "
            const fs = require('fs');
            const keys = ['@match','@connect','@grant','@include','@exclude','@require','@resource','@run-at','@noframes','@unwrap','@updateURL','@downloadURL','@supportURL','@homepage','@antifeature'];
            let b = fs.readFileSync('NOTES_IN.md', 'utf8');
            for (const k of keys) { if (b.includes(k)) b = b.split(k).join('＠' + k.slice(1)); }
            fs.writeFileSync('NOTES_OUT.md', b);
          "
          gh release edit "$GITHUB_REF_NAME" --notes-file NOTES_OUT.md
          echo "✅ 发布说明已消毒（保留真实贡献者归属）"
