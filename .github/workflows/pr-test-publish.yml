name: Publish PR Temporary Build

on:
  workflow_run:
    workflows: [PR Temporary Build]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr-temporary-script
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/pr-artifact
      - name: Validate PR and script
        id: validate
        uses: actions/github-script@v7
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/pr-artifact
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const run = context.payload.workflow_run;
            const identity = JSON.parse(fs.readFileSync(path.join(process.env.ARTIFACT_DIR, 'pr-identity.json'), 'utf8'));
            const prNumber = identity.pr;
            if (!Number.isSafeInteger(prNumber) || prNumber < 1 || !/^[a-f0-9]{40}$/.test(identity.sha)) throw new Error('Invalid PR identity');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber });
            if (pr.state !== 'open' || pr.base.ref !== 'dev' || pr.head.sha !== identity.sha || pr.head.repo.id !== identity.repository) {
              throw new Error('PR changed or is not eligible');
            }
            if (![pr.head.sha, pr.merge_commit_sha].includes(run.head_sha)) throw new Error('Build revision differs from PR');
            const script = path.join(process.env.ARTIFACT_DIR, 'dist/ai_marker.user.js');
            const stat = fs.lstatSync(script);
            if (!stat.isFile() || stat.size < 1000 || stat.size > 5000000) throw new Error('Invalid script artifact');
            const header = fs.readFileSync(script, 'utf8').slice(0, 4000);
            const url = `https://auto-update.aimarking.five-plus-one.com/ota/dev/prtest/${prNumber}.user.js`;
            if (!header.includes(`// @version      0.0.${prNumber}-prtest.${run.id}`) ||
                !header.includes(`// @downloadURL  ${url}`) ||
                !header.includes(`// @updateURL    ${url}`)) throw new Error('Unexpected script metadata');
            core.setOutput('pr', String(prNumber));
            core.setOutput('url', url);
      - name: Publish temporary script
        env:
          PR_NUMBER: ${{ steps.validate.outputs.pr }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          ARTIFACT_DIR: ${{ runner.temp }}/pr-artifact
        run: |
          set -euo pipefail
          test "$PR_NUMBER" -gt 0
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          remote="$SSH_USERNAME@$SSH_HOST"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" "$ARTIFACT_DIR/dist/ai_marker.user.js" "$remote:/tmp/aimarker-pr-$PR_NUMBER-$RUN_ID.user.js"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$remote" "set -eu; target=/opt/1panel/www/sites/aimarker-suite-ota/index/ota/dev/prtest; sudo mkdir -p \"\$target\"; owner=\$(stat -c '%U:%G' /opt/1panel/www/sites/aimarker-suite-ota/index/ota/dev); sudo cp /tmp/aimarker-pr-$PR_NUMBER-$RUN_ID.user.js \"\$target/$PR_NUMBER.user.js\"; sudo chown \"\$owner\" \"\$target/$PR_NUMBER.user.js\"; sudo chmod 644 \"\$target/$PR_NUMBER.user.js\"; rm -f /tmp/aimarker-pr-$PR_NUMBER-$RUN_ID.user.js"
      - name: Comment installation link
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.validate.outputs.pr }}
          INSTALL_URL: ${{ steps.validate.outputs.url }}
        with:
          script: |
            const pr = Number(process.env.PR_NUMBER);
            const marker = '<!-- ai-marker-prtest -->';
            const body = `${marker}\n临时测试版已构建完成。\n\n[点击快速安装脚本](${process.env.INSTALL_URL})\n\n此版本仅供当前 PR 临时测试。请使用 Tampermonkey 安装，测试时暂停其他 AI 批改助手脚本；PR 关闭后链接将失效。`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
