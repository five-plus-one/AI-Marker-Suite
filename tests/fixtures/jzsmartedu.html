<!doctype html><meta charset="utf-8"><title>焦作阅卷验收</title>
<style>.body-center-main{width:300px}.js-image{width:300px}#read-paper-score-board{padding:16px}input{padding:8px}button{padding:8px;margin:4px}.el-message{padding:12px}</style>
<div id="platform-native">
 <div class="body-center-main"><div class="single-img-wrap"><img class="js-image img-item" src="/__fixture/answer.svg"></div></div>
 <section id="read-paper-score-board" class="page-read-paper-score-board"><span id="tab-3">键盘打分</span>
  <div class="keyboard"><div class="single-score-box"><span>题号：17，满分15分</span><input class="el-input__inner" placeholder="得分"></div>
  <div class="submit-section"><button type="button">退出阅卷</button><button type="button">提交</button></div></div>
 </section>
</div><pre id="result"></pre>
<script>
const params=new URLSearchParams(location.search),mode=params.get('mode'),runId=params.get('run');
const store={'ai-grading-show-onboarding':false};
window.GM_getValue=(key,fallback)=>store[key]??fallback;window.GM_setValue=(key,value)=>store[key]=value;
window.GM_registerMenuCommand=()=>{};window.GM_deleteValue=key=>delete store[key];
window.GM_xmlhttpRequest=options=>{queueMicrotask(()=>options.onerror?.());return{abort(){}}};
const platform=document.getElementById('platform-native'),board=document.getElementById('read-paper-score-board');
const input=board.querySelector('input'),image=document.querySelector('.js-image'),imageVm={};
image.parentElement.__vue__=imageVm;
let clicks=0,keyups=0,serverMode='success';
const row={label:'17',fullScore:15,score:'',step:0,trueIndex:0};
const read={step:'0.000',scoreValue:'15.00',pointDetail:[],scoreOptions:[]};
const parent={type:2,readPaperType:'1',examPaperId:'exam',readBlockId:'block',scoreList:[{score:''}],readProgressInfo:{myselfReadCount:0}};
const nativeVm={$options:{name:'ScoreBoard'},$parent:parent,type:2,boardType:'3',autoSubmit:false,
 effectScoreList:[row],scorePointListModel:[row],currQuesBlock:{readBlockId:'block',paperRead:[read]}};
board.__vue__=nativeVm;
function paper(id){
 const data={examResultItemId:'part-'+id,paperReadId:'read',saveFileUrl:'/__fixture/answer.svg'};
 nativeVm.readItem={examResultItemId:'paper-'+id,data:[data]};parent.cacheImageList=[nativeVm.readItem,{examResultItemId:'preloaded'}];
 Object.assign(imageVm,{readItem:data,saveFileUrl:data.saveFileUrl,showSrcList:[{src:image.src}],saveFileUrlList:[{src:image.src}]});
 input.value='';row.score='';parent.scoreList[0].score='';
}
paper('A');
input.addEventListener('input',()=>row.score=input.value);
input.addEventListener('change',()=>parent.scoreList[0].score=row.score);
input.addEventListener('keyup',()=>keyups++);
if(mode==='scoreboard'){
 nativeVm.boardType='2';
 const keyboard=board.querySelector('.keyboard'),submit=keyboard.querySelector('.submit-section');
 const extremes=document.createElement('div');extremes.className='score-0-full';
 const collapse=document.createElement('div');collapse.className='score-collapse';
 const palette=document.createElement('div');palette.className='score-btn';collapse.append(palette);
 for(const score of [0,1,2.5,15]){
  const button=document.createElement('button');button.type='button';button.textContent=score===0?'零分':score===15?'满分':String(score);
  button.onclick=()=>{row.score=score;parent.scoreList[0].score=score};
  (score===0||score===15?extremes:palette).append(button);
 }
 board.append(extremes,collapse,submit);keyboard.remove();
}
function message(score){const el=document.createElement('div');el.className='el-message el-message--success';el.textContent=`提交成功！${score}分`;document.body.append(el)}
board.querySelector('.submit-section button:last-child').addEventListener('click',()=>{
 clicks++;const score=parent.scoreList[0].score;
 if(serverMode==='refused')return;
 setTimeout(()=>{message(score);parent.readProgressInfo={myselfReadCount:parent.readProgressInfo.myselfReadCount+1};paper('B')},30);
});
if(mode==='late')platform.remove();
</script><script src="/__fixture/ai_marker.user.js"></script><script>
(async()=>{
 const wait=ms=>new Promise(r=>setTimeout(r,ms)),assert=(ok,message)=>{if(!ok)throw Error(message)};
 try{
  if(mode==='foreign-route'){await wait(100);assert(!window.__AI_MARKER_ADAPTER__,'题块列表保持空注册槽')}
  else{
   if(mode==='late'){assert(!window.__AI_MARKER_ADAPTER__,'未完成页面特征时等待');await wait(150);document.body.append(platform)}
   if(mode==='spa'){assert(!window.__AI_MARKER_ADAPTER__,'首页不提前注册');location.hash='/v2/read-paper?examPaperId=exam&readBlockId=block&readPaperType=1'}
   for(let i=0;i<120&&!document.querySelector('.ai-grade-btn');i++)await wait(50);
   const a=window.__AI_MARKER_ADAPTER__;
   assert(a?.id==='jzsmartedu'&&a.isMarkingPage(),'完整压缩脚本识别焦作阅卷');
   assert(document.querySelectorAll('.ai-grade-btn').length===1,'唯一批改入口');
   assert((await a.gatherAnswerImages()).length===1,'只读取当前答卷作答');
   const old=a.getPaperIdentity(),task=a.getTaskIdentifier();
   assert(a.getScoreInputs()[0].maxScore===15,'读取平台满分');
   if(mode==='scoreboard'){
    document.querySelector('.ai-settings-btn').click();
    for(let i=0;i<50&&!document.querySelector('#btn-detect-inputs');i++)await wait(20);
    document.querySelector('#btn-detect-inputs').click();
    assert(document.querySelector('#scoring-units-list').textContent.includes('17'),'设置面板检测当前题号');
    assert(Array.from(document.querySelectorAll('#scoring-units-list input')).some(el=>el.value==='15'),'设置面板自动取得满分');
    assert(!a.fillScores([1.23])&&parent.scoreList[0].score==='','缺少档位时保持空分');
   }
   assert(a.fillScores([0])&&Number(parent.scoreList[0].score)===0,'零分同步平台实际提交模型');
   assert(clicks===0&&keyups===0,'填分不触发平台快捷提交');
   read.step='0.5';assert(!a.fillScores([1.23]),'步长外分数不填入');assert(a.fillScores([2.5]),'支持半分步长');
   if(mode==='scoreboard')parent.scoreList[0].score=3;else input.value='3';
   assert(!await a.submitGrade(),'教师手动改分后保留确认');assert(clicks===0,'改分后不点击提交');
   assert(a.fillScores([2.5]),'重新批改后同步分数');
   const guard={isCurrent:()=>a.getPaperIdentity()===old,verify:async()=>{}};
   assert(await a.submitGrade(guard),'原生成功提示与已阅进度更新后确认保存');
   assert(!guard.isCurrent(),'服务器成功后已经换卷');
   assert(await a.waitForNextPaper(image.src,{paperId:old,taskId:task}),'相同图片地址依据业务标识辨别新答卷');
   assert(!await a.submitGrade(),'同一份分数仅提交一次');assert(clicks===1,'提交次数准确');
   nativeVm.autoSubmit=true;assert(!a.fillScores([1]),'平台自动提交开启时暂停填分');
   nativeVm.autoSubmit=false;parent.isHistory=true;assert(a.isRegradeMode()&&!a.fillScores([1]),'历史回评保持平台操作');
  }
  document.getElementById('result').textContent=btoa(unescape(encodeURIComponent(JSON.stringify({runId,passed:true,width:innerWidth,mode,checks:mode==='foreign-route'?1:17}))));
 }catch(error){document.getElementById('result').textContent=btoa(unescape(encodeURIComponent(JSON.stringify({runId,passed:false,error:String(error),stack:error.stack}))))}
})();
</script>
