<!doctype html><meta charset="utf-8"><title>Zhixue transition acceptance</title>
<div name="topicImg"><img src="/__fixture/answer.svg?paper=A&Expires=1&Signature=one"></div>
<input id="txt_marking_all" value=""><pre id="result" hidden></pre>
<script>
window.GM_getValue=(key,fallback)=>key==='ai-grading-show-onboarding'?false:fallback;
window.GM_setValue=()=>{};window.GM_registerMenuCommand=()=>{};window.GM_deleteValue=()=>{};
window.GM_xmlhttpRequest=options=>{queueMicrotask(()=>options.onerror?.());return{abort(){}}};
</script><script src="/__fixture/ai_marker.user.js"></script><script>
(async()=>{
 const params=new URLSearchParams(location.search),runId=params.get('run'),checks=[];
 const assert=(value,name)=>{if(!value)throw Error(name);checks.push(name);};
 const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 const image=document.querySelector('img'),a=window.__AI_MARKER_ADAPTER__;
 const loaded=()=>image.complete&&image.naturalWidth>0?Promise.resolve():new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;});
 try{
  await loaded();assert(a?.id==='zhixue','打包后由智学网适配器接管');
  const old=a.getPaperIdentity(),controller=new AbortController();let changed=false;
  const pending=a.waitForNextPaper(image.src,{paperId:old,signal:controller.signal}).then(value=>changed=value);
  await wait(1050);assert(!changed,'清空分数框超过旧判定时间仍不换卷');
  image.src='/__fixture/answer.svg?paper=A&Expires=2&Signature=two';await loaded();
  assert(a.getPaperIdentity()===old,'签名更新维持同卷标识');await wait(450);assert(!changed,'签名续期不换卷');
  image.src='/__fixture/answer.svg?paper=B';await loaded();await wait(500);await pending;
  assert(changed,'完整新作答资源稳定后继续');assert((await a.gatherAnswerImages()).length===1,'取图与身份来源相同');
  document.getElementById('result').textContent=btoa(unescape(encodeURIComponent(JSON.stringify({runId,passed:true,width:innerWidth,checks}))));
 }catch(error){document.getElementById('result').textContent=btoa(unescape(encodeURIComponent(JSON.stringify({runId,passed:false,width:innerWidth,checks,error:error.message}))));}
})();
</script>
