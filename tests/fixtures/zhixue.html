<script>

 'ai-grading-show-onboarding':false,
 'ai-grading-presets':JSON.stringify({list:{Fixture:{question:'第31题',answer:'参考答案',rubric:'逐项给分',workflowId:'fixture',gradingMode:'unattended',
  scoring:{maxScore:10,roundStep:1,roundMethod:'round'},blankDetection:{enabled:false}}},active:'Fixture',bindings:{[location.pathname+'___第31题']:'Fixture',[location.pathname+'___第30题']:'Fixture'}}),

window.GM_getValue=(key,fallback)=>storage[key]??fallback;
window.GM_setValue=(key,value)=>storage[key]=value;window.GM_registerMenuCommand=()=>{};window.GM_deleteValue=key=>delete storage[key];
window.GM_xmlhttpRequest=options=>{
 if(options.method==='POST'&&options.url==='https://ai.fixture.invalid/v1/chat/completions'){
  effects.requests++;effects.complete=()=>options.onload({status:200,responseText:JSON.stringify({choices:[{message:{content:'【答案复述】\n未作答\n【得分】\n0'},finish_reason:'stop'}]})});
 }else queueMicrotask(()=>options.onerror?.());

</script><script src="/__fixture/ai_marker.user.js"></script><script>
(async()=>{
 const params=new URLSearchParams(location.search),runId=params.get('run'),checks=[];

 try{
  await loaded();assert(a?.id==='zhixue','打包后由智学网适配器接管');
  const old=a.getPaperIdentity(),controller=new AbortController();let changed=false;

  image.src='/__fixture/answer.svg?paper=B';await loaded();await wait(500);await pending;
  assert(changed,'完整新作答资源稳定后继续');assert((await a.gatherAnswerImages()).length===1,'取图与身份来源相同');

  popup.className = 'el-message-box__wrapper';
  popup.setAttribute('role', 'dialog');
  popup.setAttribute('aria-modal', 'true');
  popup.innerHTML = '<div class="el-message-box"><div class="el-message-box__message"><p>您该题任务量已完成，请选择继续多阅或切换到下一题?</p></div><div class="el-message-box__btns"><button class="el-button">继续多阅</button><button>切换下一题</button></div><input value="private-test-value"></div>';
  const popupRun = new AbortController(), dialogEvents = [], waitEvents = [];
  const popupWait = a.waitForNextPaper(image.src, {
      paperId: a.getPaperIdentity(), signal: popupRun.signal,
      onDialog: event => dialogEvents.push(event), onWaitObserved: event => waitEvents.push(event),
  });
  document.body.append(popup);
  await until(() => dialogEvents.length > 0);
  const snapshot = JSON.stringify(dialogEvents[0]);

  const taskId = a.getGradingTaskIdentifier();

  popup.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;z-index:100;background:#fff8';
  const moreButton = popup.querySelector('.el-button--primary');
  let quotaClicks = 0, otherClicks = 0;
  popup.querySelector('button').onclick = () => { otherClicks++; };
  moreButton.onclick = () => { quotaClicks++; };
  assert(!a.isQuotaContinuationEnabled() && a.prepareQuotaContinuation(taskId, () => true) === null, '旧用户默认手动处理配额提示');
  assert(a.saveQuotaContinuation(true) && a.isQuotaContinuationEnabled(), '智学网续批设置可本地保存');
  document.body.append(popup);
  assert(a.prepareQuotaContinuation(taskId, () => true) === null, '提交前已经打开的弹窗不参与自动续领');
  popup.remove();
  let canAct = true;
  const continuation = a.prepareQuotaContinuation(taskId, () => canAct);
  document.body.append(popup);
  assert(!continuation('另一题') && quotaClicks === 0, '题号不一致时保留原站选择');
  const message = popup.querySelector('.el-message-box__message p');
  const originalMessage = message.textContent;
  message.textContent = '您本题的当前任务量已完成，请切换到下一题!';
  assert(!continuation(taskId) && quotaClicks === 0, '只允许切题的配额提示保持待处理');
  message.textContent = originalMessage;
  moreButton.disabled = true;
  assert(!continuation(taskId), '按钮禁用时等待平台');
  moreButton.disabled = false;
  const otherPopup = popup.cloneNode(true);
  document.body.append(otherPopup);
  assert(!continuation(taskId), '出现多个原站提示时保留人工处理');
  otherPopup.remove();
  canAct = false;
  assert(!continuation(taskId), '暂停后不触发原站操作');
  canAct = true;
  assert(a.saveQuotaContinuation(false) && !continuation(taskId), '关闭设置后当前等待也停止自动续领');
  a.saveQuotaContinuation(true);
  assert(continuation(taskId) && !continuation(taskId) && quotaClicks === 1 && otherClicks === 0, '命中已知弹窗时只点击一次继续多阅');
  popup.remove();
  a.saveQuotaContinuation(false);
  const canvas=document.createElement('canvas');canvas.width=942;canvas.height=513;
  const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,942,513);
  ctx.fillStyle='black';ctx.fillText('30. answer A',20,30);const dataA=canvas.toDataURL('image/png');
  ctx.fillText('answer B',20,70);const dataB=canvas.toDataURL('image/png');
  ctx.fillText('answer C',20,105);const dataC=canvas.toDataURL('image/png');
  image.src=dataA;await loaded();const inlineId=a.getPaperIdentity();assert(!!inlineId,'内嵌增强图拥有答卷身份');
  assert(await a.fetchImageAsBase64(dataA)===dataA.split(',')[1],'增强图取图保留完整字节');
  let inlineChanged=false;const inlinePending=a.waitForNextPaper(dataA,{paperId:inlineId}).then(v=>inlineChanged=v);
  image.src=dataB;await loaded();await inlinePending;assert(inlineChanged,'内嵌增强图换卷完成');
  const source=location.origin+'/__fixture/answer.svg?x-oss-process=image/crop,x_10,y_20,w_942,h_513';
  const sourceKey=a._answerResourceKey(source),native={topicImageIds:[source],catchImage:{[sourceKey]:dataB}};
  image.parentElement.__vue__={$data:native};
  const nativeId=a.getPaperIdentity();assert(!!nativeId,'增强图绑定当前原生切图');
  native.catchImage[location.origin+'/__fixture/answer.svg?paper=previous']=dataB;
  assert(a.getPaperIdentity()===nativeId,'历史缓存中相同内容不妨碍当前增强答卷');
  image.style.height='1600px';
  assert((await a.gatherAnswerImages())[0]===dataB,'答卷超出窗口仍获取完整图片');
  image.src=source;await loaded();assert(a.getPaperIdentity()===nativeId,'关闭增强维持同卷身份');
  image.src=dataB;await loaded();native.topicImageIds=[source.replace('x_10','x_30')];
  assert(a.getPaperIdentity()===null,'原生切图已更新且旧增强图未替换时等待');
  delete image.parentElement.__vue__;image.src=dataB;await loaded();
  assert(a.getGradingTaskIdentifier().endsWith('___第31题'),'原生题号作为批改基准');
  assert(a.prepareGrading(),'平台满分与方案匹配');
  await until(()=>document.querySelector('.ai-grade-btn'));
  const quotaSetting = document.getElementById('zhixue-quota-setting');
  const quotaInput = document.getElementById('zhixue-continue-quota');
  assert(quotaSetting?.hidden === false && quotaInput?.checked === false, '考试阅卷设置显示默认关闭的续批选项');
  document.querySelector('.ai-grade-btn').click();await until(()=>effects.requests===1);
  const run=window.aiGradingState.activeRun;
  document.getElementById('currentTopicIndex').textContent='第30题';
  const score=document.querySelector('input[name="topicTxt"]');score.setAttribute('disptitle','30');score.setAttribute('score','8');
  document.querySelector('#containter_topicTxt .label').textContent='30';
  assert(!a.prepareGrading(),'原生满分与旧方案不匹配时拒绝评分准备');
  await until(()=>!window.aiGradingState.isRunning&&run.controller.signal.aborted);
  effects.complete();await wait(150);
  assert(effects.submits===0&&score.value===''&&effects.requests===1,'原生切题取消识别，迟到0分结果不得填入或提交');
  document.getElementById('currentTopicIndex').textContent='第31题';
  score.setAttribute('disptitle','31'); score.setAttribute('score','10');
  document.querySelector('#containter_topicTxt .label').textContent='31';
  assert(a.prepareGrading(), '续批场景使用同一题的评分方案');
  a.saveQuotaContinuation(true);
  quotaClicks = 0;
  document.getElementById('bnt_save').onclick = () => { effects.submits++; document.body.append(popup); };
  let releaseNewPaper;
  moreButton.onclick = () => {
      quotaClicks++;
      popup.remove();
      releaseNewPaper = () => { image.src=dataC; };
  };
  await wait(900);
  document.querySelector('.ai-grade-btn').click();
  await until(() => effects.requests === 2);
  effects.complete();
  await until(() => quotaClicks === 1);
  await wait(350);
  assert(effects.requests === 2 && effects.submits === 1 && otherClicks === 0, '点继续多阅后等待当前题新卷就绪');
  releaseNewPaper();
  await until(() => effects.requests === 3);
  assert(!!window.aiGradingState.activeRun && quotaClicks === 1, '确认同题新卷后启动下一次评分');
  Object.assign(window.aiGradingState.batchProgress, {enabled:true, currentCount:1, targetCount:2, reached:false, limitExempt:false});
  effects.complete();
  await until(() => effects.submits === 2 && window.aiGradingState.isPaused);
  await wait(350);
  assert(quotaClicks === 1 && effects.requests === 3 && otherClicks === 0 && popup.isConnected, '达到批阅目标后留在原站提示，等待用户决定');

  a.saveQuotaContinuation(false);
  Object.assign(window.aiGradingState.batchProgress, {enabled:false, reached:false});
  image.src=dataA;
  await loaded();
  document.querySelector('.ai-grade-btn').click();

  effects.complete();
  await until(() => effects.submits === 3);
  await until(() => window.aiGradingState.isPaused);

  assert(quotaClicks === 1 && otherClicks === 0 && effects.requests === 4 && popup.isConnected,
      '配额暂停保留原站选择且不继续评分');
  document.getElementById('result').textContent=btoa(unescape(encodeURIComponent(JSON.stringify({runId,passed:true,width:innerWidth,checks}))));
 }catch(error){document.getElementById('result').textContent=btoa(unescape(encodeURIComponent(JSON.stringify({runId,passed:false,width:innerWidth,checks,error:error.message}))));}
})();
</script>
