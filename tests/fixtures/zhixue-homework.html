<!doctype html><meta charset="utf-8"><title>智学网作业批改验收</title>
<div class="smart-hw-container">
  <div class="question-viewer"><div class="image-wrapper"><img src="/__fixture/answer.svg?student=first"></div></div>
  <div class="sidebar-right-container">
    <div class="operation-panel"><div class="score-interval-section"><div class="score-interval">
      <div class="correct-tool-title"><span>11 解答题</span></div>
      <div><button class="green-btn">满分</button><button class="red-btn">零分</button></div>
      <div class="score-interval-select"><input value="0.5分" readonly></div>
      <div class="score-btn-group"><div class="score-btn">6</div><div class="score-btn">7.5</div></div>
    </div></div></div>
  </div>
</div>
<pre id="result" hidden></pre>
<script>
const storage = new Map([
  ['ai-grading-show-onboarding', false],
  ['ai-grading-presets', JSON.stringify({active: '作业', bindings: {}, list: {
    作业: {answer: '参考答案', rubric: '按步骤评分', scoring: {maxScore: 10, roundStep: 0.5}},
  }})],
  ['aimarker-connected-account-v1', { accountId: 1, apiKey: 'sk-' + 'a'.repeat(32) }],
]);
window.GM_getValue = (key, fallback) => storage.get(key) ?? fallback;
window.GM_setValue = (key, value) => storage.set(key, value);
window.GM_deleteValue = key => storage.delete(key);
window.GM_listValues = () => [...storage.keys()];
window.GM_registerMenuCommand = () => {};
window.GM_xmlhttpRequest = options => { queueMicrotask(() => options.onerror?.()); return { abort() {} }; };
const root = document.querySelector('.smart-hw-container'), image = root.querySelector('img');
const effects = { submissions: [] };
const view = root.__vue__ = {
  $options: { name: 'ShuzhiCorrect' }, $el: root, hwId: 'homework-fixture', curClassId: 'fixture-class',
  curStudentItem: { studentId: 'first' }, curTopicItem: { childQuestionId: 'topic-11', standardScore: 10 },
  curBlankId: '', cutImageList: [image.src], markingType: 1,
};
function nativeSave(score) {
  const xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://pyj.zhixue.com/api-dihw-marking/online/sz/marking/modifyScore');
  xhr.setRequestHeader('Content-Type', 'application/json');
  const payload = { homeworkId: view.hwId, classId: view.curClassId, studentId: view.curStudentItem.studentId,
    childQuestionId: view.curTopicItem.childQuestionId, modifyScore: score, blankId: null };
  effects.submissions.push(payload);
  view.topicSaving = true;
  xhr.onloadend = () => { view.topicSaving = false; };
  xhr.send(JSON.stringify(payload));
}
root.querySelector('.green-btn').onclick = () => nativeSave(10);
root.querySelector('.red-btn').onclick = () => nativeSave(0);
for (const button of root.querySelectorAll('.score-btn')) button.onclick = () => nativeSave(Number(button.textContent));
</script>
<script src="/__fixture/ai_marker.user.js"></script>
<script>
(async () => {
  const runId = new URLSearchParams(location.search).get('run'), checks = [];
  const check = (value, label) => { if (!value) throw Error(label); checks.push(label); };
  const adapter = window.__AI_MARKER_ADAPTER__;
  const loadImage = async () => { if (!image.complete) await new Promise(resolve => image.addEventListener('load', resolve, { once: true })); };
  try {
    const until = async (condition, label) => {
      const deadline = Date.now() + 4500;
      while (!condition() && Date.now() < deadline) await new Promise(resolve => setTimeout(resolve, 40));
      check(condition(), label);
    };
    const get = id => document.getElementById(id);
    await loadImage();
    await until(() => get('btn-detect-inputs'), '助手设置页已加载');
    get('btn-detect-inputs').click();
    check(get('btn-detect-inputs').textContent === '读取当前题分值'
      && document.querySelector('.su-max-score').value === '10'
      && document.querySelector('.su-round-step').value === '0.5', '真实评分控件的满分和步长进入设置表格');
    check(adapter?.id === 'zhixue' && adapter.isMarkingPage() && !adapter.isQuotaContinuationEnabled, '作业路由由专用适配接管');
    const taskId = adapter.getTaskIdentifier(), first = adapter.getPaperIdentity();
    check(!!first && (await adapter.gatherAnswerImages()).length === 1 && adapter.getScoreInputs()[0].maxScore === 10, '读取当前题的答卷和满分');
    const hiddenImage = image.cloneNode();
    hiddenImage.hidden = true;
    hiddenImage.src = '/__fixture/answer.svg?student=old';
    image.after(hiddenImage);
    check(adapter.getPaperIdentity() === first && adapter.gatherAnswerImages().length === 1, '隐藏的旧答卷图不影响当前答卷');
    hiddenImage.remove();
    view.correctLoading = true;
    check(!adapter.getPaperIdentity() && adapter.getSelectedPaperIdentity() === first, '加载期间保留选中身份，等待图片就绪');
    const ready = adapter.prepareGrading();
    setTimeout(() => { view.correctLoading = false; }, 240);
    check(await ready && effects.submissions.length === 0, '准备过程中图片加载完成后可以评分');
    view.topicSaving = true;
    const afterSave = adapter.prepareGrading();
    setTimeout(() => { view.topicSaving = false; }, 240);
    check(await afterSave, '平台暂时保存时等待原站完成');
    view.canNotEdit = true;
    check(!await adapter.prepareGrading() && adapter.lastFillError.includes('只读'), '只读答卷显示具体原因');
    view.canNotEdit = false;
    const controller = new AbortController();
    view.loading = true;
    const interrupted = adapter.prepareGrading({ signal: controller.signal }).catch(error => error.message);
    controller.abort();
    view.loading = false;
    check(await interrupted === '用户主动暂停' && effects.submissions.length === 0, '等待答卷时仍可主动暂停');
    check(!adapter.fillScores([7]) && adapter.fillScores([6]) && effects.submissions.length === 0, '只暂存原站支持的分数');
    view.curStudentItem = { studentId: 'second' };
    check(!await adapter.submitGrade() && effects.submissions.length === 0, '确认前换人拦截旧卷分数');
    view.curStudentItem = { studentId: 'first' };
    check(adapter.fillScores([6]), '为当前卷暂存核定分数');
    const request = adapter.submitGrade();
    const duplicate = adapter.submitGrade();
    check(!await duplicate && await request && effects.submissions.length === 1 && effects.submissions[0].modifyScore === 6,
      '只提交一次并以成功回执确认');
    const continued = adapter.waitForNextPaper('', { paperId: first, taskId });
    view.curStudentItem = { studentId: 'second' };
    view.cutImageList = [new URL('/__fixture/answer.svg?student=second', location.href).href];
    check(!adapter.getPaperIdentity() && (await adapter.gatherAnswerImages()).length === 0, '换人时拒绝上一人的旧图片');
    image.src = view.cutImageList[0];
    await loadImage();
    check(await continued, '同题新卷稳定后方可继续');
    check(adapter.fillScores([7.5]) && !await adapter.submitGrade() && effects.submissions.length === 2,
      '原站拒绝时保留未确认结果，避免自动重发');
    view.curTopicItem = {childQuestionId:'topic-12',standardScore:10};
    check(!await adapter.waitForNextPaper('', { paperId: first, taskId }), '平台切换到下一题时停止当前方案');
    await until(() => get('ob-skip-question'), '首次切题保留自动配置引导');
    get('ob-skip-question').click();
    check(!get('ob-skip-question') && !storage.get('ai-grading-hide-question-onboarding'), '跳过只关闭当前提示');
    view.curTopicItem = {childQuestionId:'topic-13',standardScore:3};
    await until(() => get('ob-disable-question-guidance'), '下一题仍可显示配置引导');
    get('ob-disable-question-guidance').click();
    get('ob-skip-question').click();
    check(storage.get('ai-grading-hide-question-onboarding') === true
      && !get('question-onboarding-enabled').checked, '关闭自动引导的偏好与设置页同步');
    const scorePanel = root.querySelector('.operation-panel');
    scorePanel.innerHTML = '<div class="correct-tool"><div class="correct-tool-title"><span>14 单选题</span></div><div class="score-box">A B C D</div></div>';
    view.curTopicItem = {childQuestionId:'topic-14',standardScore:3};
    await new Promise(resolve => setTimeout(resolve, 1250));
    check(!get('ob-skip-question'), '偏好关闭后切题不会再次弹窗');
    get('btn-detect-inputs').click();
    check(adapter.getScoreInputs().length === 0 && !adapter.fillScores([3])
      && document.body.textContent.includes('本题按答案选项计分') && effects.submissions.length === 2,
      '选项题提示原站计分方式并阻止数值写入');
    get('question-onboarding-enabled').click();
    view.curTopicItem = {childQuestionId:'topic-15',standardScore:3};
    await until(() => get('ob-skip-question'), '在设置里重新开启后可再次显示配置引导');
  } catch (error) {
    document.getElementById('result').textContent = btoa(unescape(encodeURIComponent(JSON.stringify({runId,passed:false,width:innerWidth,checks,error:error.message}))));
    return;
  }
  document.getElementById('result').textContent = btoa(unescape(encodeURIComponent(JSON.stringify({runId,passed:true,width:innerWidth,checks}))));
})();
</script>
