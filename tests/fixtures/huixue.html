<!doctype html><meta charset="utf-8"><title>天喻慧学阅卷验收</title>
<style>body{font:16px system-ui;margin:24px}main{max-width:850px}.img img{width:100%;max-width:500px}input{font-size:20px;width:100px}a{display:inline-block;padding:12px;color:#1677ff;cursor:pointer}</style>
<main><h1>天喻慧学</h1><p>普通阅卷 · 键盘给分</p><div id="panel"></div><p id="status">正在核对答卷与给分流程</p></main><pre id="result" hidden></pre>
<script>
const runId=new URLSearchParams(location.search).get('run'),mode=new URLSearchParams(location.search).get('mode');
const store={'ai-grading-show-onboarding':false};window.GM_getValue=(k,v)=>store[k]??v;window.GM_setValue=(k,v)=>store[k]=v;window.GM_registerMenuCommand=()=>{};
const huizhou=location.hostname==='hx-webscan.hzjy.edu.cn',maxScore=huizhou?4:20,question=huizhou?'32.3':'76';
let root,input,image,saves=0,failSave=false;
const point={markItemScoreId:'point',markItemId:'question',name:question,score:maxScore,scoreLimite:Array.from({length:maxScore+1},(_,i)=>i).join(','),value:null};
const page={$options:{name:'GeneralReview'},$route:{query:{examId:'exam',subjectId:'subject',role:'Normal'}},markItemId:'question',markerId:'teacher',selectValue:question,scorePointList:[point],domCountArr:[],hasImg:true,replayComment:'进入回评',finishedCount:0,count:0,$nextTick:()=>Promise.resolve(),async submitScoreFn(){saves++;await new Promise(r=>setTimeout(r,30));if(failSave){this.count=1;return}this.finishedCount++;this.count=0;this.hasImg=false;setTimeout(()=>{next('B');this.hasImg=true},60)}};
Object.defineProperty(page,'totalScore',{get:()=>page.domCountArr.reduce((a,b)=>a+b,0)});
function next(id){page.markEntityKey='mark-'+id;page.handlerEntityKey='handler-'+id;page.secretNumber='anonymous-'+id;page.img=[{imgAddress:location.origin+'/__fixture/answer.svg?id='+id}];image.src=page.img[0].imgAddress;input.value='';point.value=null;page.domCountArr=[]}
function mount(){document.getElementById('panel').innerHTML='<div class="generalReview"><div class="score-board"><div class="set-list"><input type="number" score="'+maxScore+'" aria-label="分数"></div><a name="submit-btn">提交分数</a></div><div class="paper-topic-list"><div class="paper-item"><div class="img-content"><div class="dragPaperScore"><div class="img"><img alt="示例作答"></div></div></div></div></div></div>';root=document.querySelector('.generalReview');input=root.querySelector('input');image=root.querySelector('img');root.__vue__=page;page.$el=root;page.$refs={dragPaper:root.querySelector('.dragPaperScore')};input.addEventListener('input',()=>{point.value=input.value===''?null:Number(input.value);page.domCountArr=point.value===null?[]:[point.value]});next('A')}
if(mode==='late'||mode==='spa')setTimeout(()=>{if(mode==='spa')location.hash='/generalReview';mount()},200);else mount();
</script><script src="/__fixture/ai_marker.user.js"></script><script>
(async()=>{const wait=ms=>new Promise(r=>setTimeout(r,ms));let checks=0;const check=(ok,msg)=>{checks++;if(!ok)throw Error(msg)};try{
for(let i=0;i<100&&!window.__AI_MARKER_ADAPTER__?.getPaperIdentity();i++)await wait(50);
const a=window.__AI_MARKER_ADAPTER__,first=a.getPaperIdentity(),task=a.getTaskIdentifier();check(a.id==='huixue'&&a.name===(huizhou?'惠州市智慧教育平台':'天喻慧学')&&!!first,'识别原生阅卷页');check(a.getQuestionContext().units[0].maxScore===maxScore,'读取题目与满分');
check((await a.gatherAnswerImages())[0]===image.src,'读取当前题块原图');check(!a.fillScores([1.5])&&input.value==='','整数分档校验');check(a.fillScores([0])&&page.totalScore===0,'零分原生回填');check(a.fillScores([maxScore])&&page.totalScore===maxScore,'满分回填');
page.isAutoSubmit=true;check(!a.fillScores([2]),'自动提交时暂停');page.isAutoSubmit=false;
check(a.fillScores([maxScore-1]),'准备评分');failSave=true;check(!await a.submitGrade()&&page.finishedCount===0,'保存失败明确失败');page.count=0;failSave=false;
check(a.fillScores([maxScore-1])&&await a.submitGrade({isCurrent:()=>a.getPaperIdentity()===first}),'原生保存确认');check(await a.waitForNextPaper('',{paperId:first,taskId:task}),'等待下一份完整图片');check(a.getPaperIdentity()!==first&&saves===2,'答卷身份变化');
const c=new AbortController();c.abort();check(!await a.submitGrade({signal:c.signal}),'暂停后停止提交');
document.getElementById('status').textContent='已完成：题目核对、零分与满分给分、保存确认和下一份答卷。';document.getElementById('result').textContent=btoa(unescape(encodeURIComponent(JSON.stringify({runId,passed:true,width:innerWidth,checks}))));
}catch(error){document.getElementById('status').textContent=String(error);document.getElementById('result').textContent=btoa(unescape(encodeURIComponent(JSON.stringify({runId,passed:false,error:String(error),stack:error.stack}))))}})();
</script>
