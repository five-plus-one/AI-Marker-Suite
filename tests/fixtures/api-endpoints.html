<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>5plus1API 端点切换</title>
<script>
const storage = new Map(), checks = [], requests = [];
let outcomes = [], failStorage = false, cloudPolicy;
const cloudRequests = [];
window.GM_getValue = (key, fallback) => storage.get(key) ?? fallback;
window.GM_deleteValue = key => storage.delete(key);
window.GM_setValue = (key, value) => {
    if (failStorage && key === 'ai-grading-providers-v2') throw Error('storage unavailable');
    storage.set(key, value);
};
window.getUIRoot = () => document.body;
window.showToast = () => {};
window.GM_xmlhttpRequest = request => {
    if (request.method === 'GET') {
        cloudRequests.push({ url: request.url, headers: request.headers, anonymous: request.anonymous });
        queueMicrotask(() => cloudPolicy ? request.onload({ status: 200, finalUrl: request.url, responseText: JSON.stringify(cloudPolicy) }) : request.onerror());
        return { abort() {} };
    }
    const outcome = outcomes.shift();
    const observed = { url: request.url, data: JSON.parse(request.data), redirect: request.redirect, cancelled: false };
    requests.push(observed);
    const timer = setTimeout(() => {
        if (outcome === 'network') request.onerror();
        else if (outcome === 'timeout') request.ontimeout();
        else if (outcome === 'ok') request.onload({ status: 200, finalUrl: request.url, responseText: '{"choices":[{"message":{"content":"收到"}}]}' });
        else if (outcome === 'stream') {
            request.onprogress({ responseText: 'data: {"choices":[{"delta":{"content":"已开始"}}]}\n\n' });
            request.onerror();
        }
        else request.onload(outcome || {});
    }, outcome === 'delayed' ? 1000 : 0);
    return { abort() { clearTimeout(timer); observed.cancelled = true; request.onabort(); } };
};
</script>

<script src="../../src/core/state.js"></script>
<script src="../../src/core/runtime.js"></script>
<script src="../../src/core/score.js"></script>

<script src="../../src/core/preset.js"></script>

<body><pre id="result"></pre>
<script>
(async () => {
    const runId = new URLSearchParams(location.search).get('run');
    const { DEFAULT_ENDPOINT: main, SHANGHAI_ENDPOINT: shanghai } = SCRIPT_CONFIG;
    const official = () => ProviderManager.getProvider('5plus1官方');
    const get = id => document.getElementById(id);
    const check = (value, label) => {
        checks.push({ pass: Boolean(value), label });
        if (!value) throw new Error(label);
    };
    const reset = (...responses) => { requests.length = 0; outcomes = responses; };
    const tried = (...urls) => requests.map(request => request.url).join() === urls.join();
    const start = () => {
        showOnboardingDialog(true);
        get('ob-apikey').value = 'fixture-key';
        return get('ob-next').onclick();
    };
    try {
        reset('ok');
        check((await verifyOfficialApiKey('fixture-key')).endpoint === main && tried(main), '主端点可用时只访问主端点');
        reset({ status: 401, responseText: '{"error":{"message":"invalid"}}' });
        await start();
        check(tried(main) && get('ob-status').textContent.includes('密钥无效') && !official().apiKey, '密钥错误提示重新输入');
        hideOnboardingDialog();
        reset({ status: 429, responseText: '{"error":{"message":"rate limit"}}' });
        check((await verifyOfficialApiKey('fixture-key')).reason === 'service' && tried(main), '服务响应不当成线路故障');
        reset('network', 'timeout');
        await start();
        check(tried(main, shanghai) && get('ob-status').textContent.includes('暂时无法连接') && official().endpoint === main && !official().apiKey,
            '两端点都不可用时保留原配置');
        hideOnboardingDialog();
        reset({ status: 200, responseText: '<html>Gateway</html>' }, 'ok');
        check((await verifyOfficialApiKey('fixture-key')).endpoint === shanghai && tried(main, shanghai), '网页拦截响应触发备用端点');
        reset({ status: 200, finalUrl: 'https://other.example', responseText: '{"choices":[{"message":{}}]}' }, 'ok');
        check((await verifyOfficialApiKey('fixture-key')).endpoint === shanghai && requests.every(r => r.redirect === 'error'), '验证限制在已配置的官方域名');
        reset('delayed');
        const pending = start();
        await Promise.resolve();
        get('ob-skip').click();
        await pending;
        check(tried(main) && requests[0].cancelled && !get('ob-status') && !official().apiKey, '离开首次设置时取消验证且不保存');
        reset('timeout', 'ok');
        await start();
        check(tried(main, shanghai) && get('ob-preset-name') && official().endpointLine === 'default' && official().apiKey === 'fixture-key'
            && document.querySelector('.ai-modal-body [role="status"]').textContent.includes('上海备用端点'), '备用验证成功后保存密钥并保留云控默认选择');
        check(requests.every(r => r.data.messages.length === 1 && r.data.messages[0].content === '回复：收到'), '使用独立的验证消息');
        hideOnboardingDialog();
        ProviderManager.init();
        check(ProviderManager.getCallConfig('5plus1官方', 'aimarker-fast').endpoint === main, '重载后仍跟随云控默认端点');
        check(ProviderManager.saveOfficialConnection('backup'), '可以固定选择上海备用端点');
        reset('ok');
        check((await verifyOfficialApiKey('fixture-key', { endpoint: official().endpoint })).endpoint === shanghai && tried(shanghai), '已选备用端点重新验证时直接使用');
        window.getChannelName = window.getBuildChannel = window.getBuildChannelLabel = () => 'dev';
        window.markUnsavedChanges = () => {};
        setupSettingsMenuLayout = () => {};
        loadSettings = () => {};
        renderChangelog = () => {};
        renderPresetDropdown = () => {};
        fillFormFromActivePreset = () => {};
        createSettingsPanel({ deferOpen: true });
        get('ai-grading-settings').style.display = 'block';
        renderProviderDropdown();
        get('ai-provider').value = '5plus1官方';
        handleProviderChange();
        const select = get('official-endpoint'), custom = get('custom-endpoint-field');
        check(!get('manual-api-field').open && !get('official-account-field').hidden &&
            document.querySelector('[data-marker-login]').textContent.includes('登录并连接'), '官方设置优先账号登录，并折叠手填密钥');
        const fixtureAccountKey = 'sk-' + 'd'.repeat(32);
        storage.set(MARKER_ACCOUNT_KEY, { accountId: 17, apiKey: fixtureAccountKey });
        get('ai-grading-settings').dispatchEvent(new Event('marker-account-refresh'));
        const accountCall = ProviderManager.getCallConfig('5plus1官方', 'aimarker-fast');
        check(accountCall.officialAccountId === 17 && !accountCall.apiKey &&
            !document.documentElement.innerHTML.includes(fixtureAccountKey) && get('api-key').value === 'fixture-key',
            '账号密钥仅在实际请求时读取，手填密钥独立保留');
        const beforeBlockedCall = requests.length;
        await callAIOnce('模拟请求', [], { ...accountCall, endpoint: 'https://other.example/v1/chat/completions' })
            .then(() => { throw Error('账号密钥必须限定在官方端点'); }, () => {});
        check(requests.length === beforeBlockedCall, '第三方端点无法使用五加一账号密钥');
        check(disconnectMarkerAccount() && ProviderManager.getCallConfig('5plus1官方','aimarker-fast').apiKey === 'fixture-key',
            '断开账号后恢复手填密钥');
        get('ai-grading-settings').dispatchEvent(new Event('marker-account-refresh'));
        check(select.value === 'backup' && custom.hidden && !get('official-endpoint-field').hidden
            && get('official-endpoint-help').textContent.includes('自动选择'), '设置显示当前官方端点与使用提示');
        const change = endpoint => { select.value = endpoint; select.dispatchEvent(new Event('change')); };
        change('primary');
        check(official().endpoint === main && official().apiKey === 'fixture-key', '切换端点保留 API 密钥');
        failStorage = true;
        change('backup');
        check(select.value === 'primary' && official().endpoint === main, '保存失败恢复已保存的选择');
        failStorage = false;
        change('backup');
        check(JSON.parse(storage.get('ai-grading-providers-v2')).providers['5plus1官方'].endpoint === shanghai, '手动切换持久保存');
        get('ai-provider').value = 'OpenAI兼容';
        handleProviderChange();
        check(get('official-endpoint-field').hidden && !custom.hidden && get('api-endpoint').value.includes('api.openai.com'), '自定义服务保持网关配置');
        check(get('manual-api-field').open && get('official-account-field').hidden, '自定义服务直接展示手填设置');
        check(cloudRequests.length === 1 && cloudRequests[0].url === SCRIPT_CONFIG.API_ROUTING_URL
            && cloudRequests[0].anonymous && !cloudRequests[0].headers, '云控读取独立于密钥与答卷');
        const cloudMain = 'https://regional-fixture.ai.five-plus-one.com/v1/chat/completions';
        cloudPolicy = { revision: 2, official: { endpoint: cloudMain, backupEndpoint: shanghai } };
        officialApiRoutingChecked = 0;
        await refreshOfficialApiRoutes();
        check(getOfficialApiEndpoint('primary') === cloudMain && official().endpointLine === 'backup', '新版云控覆盖默认地址并保留用户端点选择');
        cloudPolicy = { revision: 3, official: { endpoint: 'https://api.ai.five-plus-one.com.other.example/v1/chat/completions', backupEndpoint: shanghai } };
        officialApiRoutingChecked = 0;
        await refreshOfficialApiRoutes();
        check(getOfficialApiEndpoint('primary') === cloudMain && officialApiRoutes.revision === 2, '拒绝不受信任的云控地址');
        const grading = { endpoint: main, officialApiLine: 'primary', apiKey: 'fixture-key', model: 'aimarker-fast', gradingRequest: true,
            [STUDENT_GRADING_EVIDENCE]: { status: 'readable', answer: '模拟答案' } };
        reset('network', 'ok');
        check(await callAI('评分练习', [], grading) === '收到' && tried(cloudMain, shanghai), '批改遇到连接错误时切换备用端点');
        reset('ok');
        check(await callAI('评分练习', [], grading) === '收到' && tried(shanghai), '后续批改沿用已验证的端点');
        officialApiFallback = null;
        reset('stream');
        await callAI('评分练习', [], grading).then(() => { throw Error('未识别流中断'); }, () => {});
        check(tried(cloudMain), '已开始输出的评分请求不跨端点重放');
        reset('network');
        const customUrl = 'https://custom.example/v1/chat/completions';
        await callAI('评分练习', [], { ...grading, officialApiLine: undefined, endpoint: customUrl })
            .then(() => { throw Error('未识别自定义线路错误'); }, () => {});
        check(tried(customUrl), '第三方服务仍走自己的端点');
        const hongKong = 'https://api-hk.ai.five-plus-one.com/v1/chat/completions';
        const shaoxing = 'https://api-sx.ai.five-plus-one.com/v1/chat/completions';
        storage.delete('ai-marker-official-api-routes-v3');
        storage.set('ai-marker-official-api-routes', { revision: 4, official: { endpoint: main, backupEndpoint: shanghai } });
        officialApiRoutes = builtInOfficialRoutes;
        cloudPolicy = { revision: 4, official: { defaultEndpointId: 'primary', fallbackEndpointId: 'backup', endpoints: [
            { id: 'primary', name: '主端点（自动分流）', endpoint: main },
            { id: 'hongKong', name: '香港端点', endpoint: hongKong },
            { id: 'shaoxing', name: '绍兴端点', endpoint: shaoxing },
            { id: 'backup', name: '上海备用端点', endpoint: shanghai },
        ] } };
        officialApiRoutingChecked = 0;
        await refreshOfficialApiRoutes();
        get('ai-provider').value = '5plus1官方';
        handleProviderChange();
        check(Array.from(select.options, option => option.textContent).join('|') === '自动选择（主端点）|主端点（自动分流）|香港端点|绍兴端点|上海备用端点',
            '旧脚本已缓存同修订号时仍能读取四条云控线路');
        change('hongKong');
        check(official().endpoint === hongKong && official().apiKey === 'fixture-key', '香港端点使用原有密钥');
        reset('ok');
        check(await callAI('评分练习', [], { ...grading, officialApiLine: 'hongKong' }) === '收到' && tried(hongKong), '香港端点实际用于批改');
        change('shaoxing');
        ProviderManager.init();
        check(ProviderManager.getCallConfig('5plus1官方', 'aimarker-fast').endpoint === shaoxing
            && official().endpointLine === 'shaoxing', '绍兴端点重载后继续使用');
        reset('network', 'ok');
        check(await callAI('评分练习', [], { ...grading, officialApiLine: 'shaoxing' }) === '收到'
            && tried(shaoxing, shanghai), '绍兴不可达时使用上海备用端点');
        check(!applyOfficialApiRoutes({
            revision: 5, official: { endpoint: main, backupEndpoint: shanghai, shaoxingEndpoint: main },
        }) && getOfficialApiEndpoint('shaoxing') === shaoxing, '拒绝重复地址和不正确的绍兴旧版配置');
        const newUrl = 'https://api-ai-sx.ai.five-plus-one.com/v1/chat/completions';
        const endpoints = [
            { id: 'primary', name: '自动分流', endpoint: main },
            { id: 'hongKong', name: '香港直连', endpoint: hongKong },
            { id: 'shaoxing', name: '绍兴直连', endpoint: newUrl },
            { id: 'backup', name: '上海备用端点', endpoint: shanghai },
        ];
        const cloudList = { defaultEndpointId: 'hongKong', fallbackEndpointId: 'backup', endpoints };
        cloudPolicy = { revision: 6, official: cloudList };
        officialApiRoutingChecked = 0;
        await refreshOfficialApiRoutes();
        refreshOfficialEndpointOptions();
        check(select.value === 'shaoxing' && select.selectedOptions[0].textContent === '绍兴直连'
            && ProviderManager.getCallConfig('5plus1官方', 'aimarker-fast').endpoint === newUrl,
            '保留手选端点 ID，显示云控名称并使用更新后的地址');
        check(getOfficialApiEndpoint('default') === hongKong && getOfficialApiEndpoint('primary') === main, '默认 ID 和固定主端点各自独立');
        change('default');
        ProviderManager.init();
        check(official().endpointLine === 'default' && official().apiKey === 'fixture-key', '跟随默认选择可保存，保留密钥');
        const extraUrl = 'https://api-third.ai.five-plus-one.com/v1/chat/completions';
        const extra = { id: 'third-route', name: '<新线路>', endpoint: extraUrl };
        cloudPolicy = { revision: 7, official: { ...cloudList, defaultEndpointId: extra.id, endpoints: [...endpoints, extra] } };
        officialApiRoutingChecked = 0;
        await refreshOfficialApiRoutes();
        refreshOfficialEndpointOptions();
        check(select.value === 'default' && select.selectedOptions[0].textContent === '自动选择（<新线路>）'
            && select.options.length === 6, '新增线路可直接显示，跟随默认的用户收到新地址');
        reset('ok');
        check(await callAI('评分练习', [], { ...grading, officialApiLine: 'default' }) === '收到' && tried(extraUrl), '批改使用云控默认地址');
        change(extra.id);
        const badCloud = { ...cloudList, endpoints: [...endpoints, { ...extra, endpoint: 'https://example.invalid/v1/chat/completions' }] };
        check(!applyOfficialApiRoutes({ revision: 8, official: badCloud })
            && !applyOfficialApiRoutes({ revision: 8, official: { ...cloudList, endpoints: [...endpoints, endpoints[0]] } })
            && !applyOfficialApiRoutes({ revision: 8, official: { ...cloudList, defaultEndpointId: 'missing' } })
            && getOfficialApiEndpoint(extra.id) === extraUrl, '拒绝不受信任的地址、重复端点和不存在的默认端点');
        const cacheKey = 'ai-marker-official-api-routes-v3';
        check(storage.get(cacheKey)?.official?.endpoints.at(-1)?.id === extra.id, '保存云控端点清单');
        officialApiRoutes = builtInOfficialRoutes;
        cloudPolicy = undefined;
        officialApiRoutingChecked = 0;
        await refreshOfficialApiRoutes();
        check(getOfficialApiEndpoint('shaoxing') === newUrl && getOfficialApiEndpoint(extra.id) === extraUrl,
            '云控短暂不可用时沿用最近的有效配置');
        cloudPolicy = { revision: 8, official: cloudList };
        officialApiRoutingChecked = 0;
        await refreshOfficialApiRoutes();
        refreshOfficialEndpointOptions();
        check(select.value === 'default' && ProviderManager.getCallConfig('5plus1官方', 'aimarker-fast').endpoint === hongKong,
            '下线的手选端点改用当前默认端点');

        storage.set(MARKER_ACCOUNT_KEY, { accountId: 17, apiKey: fixtureAccountKey });
        storage.set(MARKER_ACTIVE_CONNECTION, 'pending-connection');
        storage.set(QUESTION_ONBOARDING_DISABLED, true);
        showConfirmModal = async () => true;
        await get('btn-reset-config').onclick();
        check(!markerManagedAccount() && !storage.has(MARKER_ACTIVE_CONNECTION)
            && !storage.get(QUESTION_ONBOARDING_DISABLED) && storage.get('ai-grading-show-onboarding')
            && !ProviderManager.getCallConfig('5plus1官方', 'aimarker-fast').apiKey,
            '恢复默认设置清除本机账号连接、待授权状态和手填密钥，并恢复引导');
    } catch (error) { checks.push({ pass: false, label: String(error.message) }); }
    get('result').textContent = btoa(unescape(encodeURIComponent(JSON.stringify({ runId, width: innerWidth, passed: checks.every(item => item.pass), checks }))));
})();
</script>
