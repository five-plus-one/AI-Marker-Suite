<title>5plus1API 端点切换</title>
<script>
const storage = new Map(), checks = [], requests = [];
let outcomes = [], failStorage = false, cloudPolicy;
const cloudRequests = [];
window.GM_getValue = (key, fallback) => storage.get(key) ?? fallback;
window.GM_deleteValue = key => storage.delete(key);
window.GM_setValue = (key, value) => {
    if (failStorage && key === 'ai-grading-providers-v2') throw Error('storage unavailable');
    storage.set(key, value);
};
window.getUIRoot = () => document.body;
window.showToast = () => {};
window.GM_xmlhttpRequest = request => {
    if (request.method === 'GET') {
        cloudRequests.push({ url: request.url, headers: request.headers, anonymous: request.anonymous });
        queueMicrotask(() => cloudPolicy ? request.onload({ status: 200, finalUrl: request.url, responseText: JSON.stringify(cloudPolicy) }) : request.onerror());
        return { abort() {} };
    }
    const outcome = outcomes.shift();
    const observed = { url: request.url, data: JSON.parse(request.data), redirect: request.redirect, cancelled: false };
    requests.push(observed);
    const timer = setTimeout(() => {
        if (outcome === 'network') request.onerror();
        else if (outcome === 'timeout') request.ontimeout();
        else if (outcome === 'ok') request.onload({ status: 200, finalUrl: request.url, responseText: '{"choices":[{"message":{"content":"收到"}}]}' });
        else if (outcome === 'stream') {
            request.onprogress({ responseText: 'data: {"choices":[{"delta":{"content":"已开始"}}]}\n\n' });
            request.onerror();
        }
        else request.onload(outcome || {});
    }, outcome === 'delayed' ? 1000 : 0);
    return { abort() { clearTimeout(timer); observed.cancelled = true; request.onabort(); } };
};
</script>

        await refreshOfficialApiRoutes();
        refreshOfficialEndpointOptions();
        check(select.value === 'default' && select.selectedOptions[0].textContent === '自动选择（<新线路>）'
            && select.options.length === 6, '新增线路可直接显示，跟随默认的用户收到新地址');
        reset('ok');
        check(await callAI('评分练习', [], { ...grading, officialApiLine: 'default' }) === '收到' && tried(extraUrl), '批改使用云控默认地址');
        change(extra.id);
        const badCloud = { ...cloudList, endpoints: [...endpoints, { ...extra, endpoint: 'https://example.invalid/v1/chat/completions' }] };
        check(!applyOfficialApiRoutes({ revision: 8, official: badCloud })
            && !applyOfficialApiRoutes({ revision: 8, official: { ...cloudList, endpoints: [...endpoints, endpoints[0]] } })
            && !applyOfficialApiRoutes({ revision: 8, official: { ...cloudList, defaultEndpointId: 'missing' } })
            && getOfficialApiEndpoint(extra.id) === extraUrl, '拒绝不受信任的地址、重复端点和不存在的默认端点');
        const cacheKey = 'ai-marker-official-api-routes-v3';
        check(storage.get(cacheKey)?.official?.endpoints.at(-1)?.id === extra.id, '保存云控端点清单');
        officialApiRoutes = builtInOfficialRoutes;
        cloudPolicy = undefined;
        officialApiRoutingChecked = 0;
        await refreshOfficialApiRoutes();
        check(getOfficialApiEndpoint('shaoxing') === newUrl && getOfficialApiEndpoint(extra.id) === extraUrl,
            '云控短暂不可用时沿用最近的有效配置');
        cloudPolicy = { revision: 8, official: cloudList };
        officialApiRoutingChecked = 0;
        await refreshOfficialApiRoutes();
        refreshOfficialEndpointOptions();
        check(select.value === 'default' && ProviderManager.getCallConfig('5plus1官方', 'aimarker-fast').endpoint === hongKong,
            '下线的手选端点改用当前默认端点');

        storage.set(MARKER_ACCOUNT_KEY, { accountId: 17, apiKey: fixtureAccountKey });
        storage.set(MARKER_ACTIVE_CONNECTION, 'pending-connection');
        storage.set(QUESTION_ONBOARDING_DISABLED, true);
        showConfirmModal = async () => true;
        await get('btn-reset-config').onclick();
        check(!markerManagedAccount() && !storage.has(MARKER_ACTIVE_CONNECTION)
            && !storage.get(QUESTION_ONBOARDING_DISABLED) && storage.get('ai-grading-show-onboarding')
            && !ProviderManager.getCallConfig('5plus1官方', 'aimarker-fast').apiKey,
            '恢复默认设置清除本机账号连接、待授权状态和手填密钥，并恢复引导');
    } catch (error) { checks.push({ pass: false, label: String(error.message) }); }
    get('result').textContent = btoa(unescape(encodeURIComponent(JSON.stringify({ runId, width: innerWidth, passed: checks.every(item => item.pass), checks }))));
})();
</script>
