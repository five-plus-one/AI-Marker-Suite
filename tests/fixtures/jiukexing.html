<!doctype html><meta charset="utf-8"><title>九科星阅卷验收</title>
<div id="app"><main class="MTcontainer_content"><div class="examText"><div class="imgBG"></div></div>
<div class="quesGrade"><h1>13</h1><input class="input_btn specialInput" placeholder="≤10分"></div>
<div class="autosubmit"><label><input type="checkbox" id="native-auto" checked>自动提交</label></div>
<button class="submitbtn">提交</button></main></div><pre id="result"></pre>
<script>
const params=new URLSearchParams(location.search),mode=params.get('mode'),runId=params.get('run');
const store={'ai-grading-show-onboarding':false};
window.GM_getValue=(key,fallback)=>store[key]??fallback;window.GM_setValue=(key,value)=>store[key]=value;
window.GM_deleteValue=key=>delete store[key];window.GM_registerMenuCommand=()=>{};
window.GM_xmlhttpRequest=options=>{queueMicrotask(()=>options.onerror?.());return{abort(){}}};
const app=document.getElementById('app'),container=document.querySelector('.imgBG'),input=document.querySelector('input');
const vm={examId:'exam',subjectId:'subject',questionvalue:'block',isdp:1,radio:2,checked:true,oldornew:'new',
 getGradeList:[],imgsList:[],markingNow:{},questionObj:{enableScoreStep:0},submit(){},changePaper(){},openFlag(){}};
app.__vue__={$children:[vm]};let calls=0,keyups=0,refused=false,activities=0;
vm.afterOperate=()=>activities++;
const autoInput=document.getElementById('native-auto');autoInput.onchange=()=>vm.checked=autoInput.checked;
function paper(id){
 vm.markingNow={id,scanPaperId:'scan-'+id,markingRecordId:'record-'+id,questionBlockId:'block',
  markingUrlList:Array.from({length:mode==='multi'?3:1},(_,i)=>({markingUrlObj:location.origin+'/__fixture/answer.svg?part='+i}))};
 vm.getGradeList=[{customQuestionNumber:'13',score:10,grade:''}];input.value='';
 vm.imgsList=[{showLoading:true,imgUrl:vm.markingNow.markingUrlList.map(x=>({...x}))}];
 container.replaceChildren(...vm.markingNow.markingUrlList.map(x=>{const image=document.createElement('img');image.src=x.markingUrlObj;return image}));
 Promise.all(Array.from(container.children).map(image=>image.complete?Promise.resolve():new Promise(resolve=>image.onload=resolve))).then(()=>vm.imgsList[0].showLoading=false);
}
vm.$api={task:{submitScore(payload){calls++;return new Promise(resolve=>setTimeout(()=>{
 if(refused==='refresh'){
  const dialog=document.createElement('div');dialog.className='el-message-box__wrapper';
  dialog.innerHTML='<div class="el-message-box__message"><p>提交分数失败，请刷新页面后重试！</p></div><div class="el-message-box__btns"><button class="el-button--primary">确定</button></div>';
  document.body.append(dialog);dialog.querySelector('button').onclick=()=>{dialog.remove();paper('C')};
  resolve({code:13303,msg:'提交分数失败，请刷新页面后重试！'});return;
 }
 if(!refused)paper('B');resolve({code:refused?13303:0});},20))}}};
input.oninput=()=>vm.getGradeList[0].grade=input.value;input.onkeyup=()=>keyups++;
document.querySelector('.submitbtn').onclick=()=>vm.$api.task.submitScore({paperId:vm.markingNow.id,questionBlockId:vm.questionvalue,
 studentScore:Number(vm.getGradeList[0].grade),childList:[]});
paper('A');const content=document.querySelector('.MTcontainer_content');if(mode==='late')content.remove();
</script><script src="/__fixture/ai_marker.user.js"></script><script>
(async()=>{
 const wait=ms=>new Promise(r=>setTimeout(r,ms)),assert=(ok,message)=>{if(!ok)throw Error(message)};
 try{
  if(mode==='late'){await wait(150);app.append(content)}
  if(mode==='spa'){assert(!window.__AI_MARKER_ADAPTER__.isMarkingPage(),'任务列表不作为阅卷页');history.pushState({},'',location.href.replace('/task/taskDetail','/marking'))}
  for(let i=0;i<120&&!document.querySelector('.ai-grade-btn');i++)await wait(50);
  const a=window.__AI_MARKER_ADAPTER__;assert(a?.id==='jiukexing'&&a.isMarkingPage(),'完整压缩脚本识别原生阅卷组件');
  assert(document.querySelectorAll('.ai-grade-btn').length===1,'唯一批改入口');
  assert(a.prepareGrading()&&vm.checked===false&&!autoInput.checked,'批改前通过原生控件关闭自动提交');
  const urls=await a.gatherAnswerImages();assert(urls.length===(mode==='multi'?3:1),'整组图片全部就绪');
  assert(a.getScoreInputs()[0].maxScore===10&&a.getScoreInputs()[0].label==='13','取得原生题号满分');
  const old=a.getPaperIdentity(),task=a.getTaskIdentifier();
  assert(a.fillScores([0])&&Number(vm.getGradeList[0].grade)===0,'零分进入原生评分状态');
  assert(calls===0&&keyups===0,'填分不触发快捷提交');
  vm.checked=true;autoInput.checked=true;
  assert(a.fillScores([5])&&vm.checked===false&&!autoInput.checked&&calls===0,'填分前再次关闭自动提交');
  vm.checked=true;autoInput.checked=true;autoInput.disabled=true;
  assert(!a.fillScores([5])&&a.lastFillError.includes('自动提交')&&calls===0,'关闭失败时不提交且保留原因');
  autoInput.disabled=false;assert(a.prepareGrading(),'控件恢复后可继续');
  vm.questionObj={enableScoreStep:1,intervalScore:3};assert(!a.fillScores([5]),'遵守平台梯度');vm.questionObj={enableScoreStep:0};
  assert(a.fillScores([2.5]),'支持半分');refused=true;assert(!await a.submitGrade(),'平台拒绝不算保存成功');
  assert(activities===0,'填分与保存失败不更新闲置计时');refused=false;
  assert(a.fillScores([2.5]),'重新填分');assert(await a.submitGrade({isCurrent:()=>true,verify:async()=>{}}),'平台保存回执成功');
  assert(activities===1,'服务端确认保存后更新原生活动');
  assert(await a.waitForNextPaper(urls[0],{paperId:old,taskId:task}),'图片URL相同时按原生ID识别新卷');
  assert(!await a.submitGrade()&&calls===2,'评分只提交一次');
  await a.gatherAnswerImages();assert(a.fillScores([5]),'为下一卷评分');refused='refresh';
  assert(!await a.submitGrade(),'明确拒绝不计成功');
  assert(await a.recoverSubmission({isCurrent:()=>true}),'确认原生提示后重新取卷');
  assert(input.value===''&&calls===3&&activities===1,'恢复不复用旧分数、不重发请求、不登记成功活动');
  assert(!await a.recoverSubmission(),'同一失败只恢复一次');
  vm.oldornew='old';assert(a.isRegradeMode()&&!a.fillScores([2]),'历史回评保持平台操作');
  document.getElementById('result').textContent=btoa(unescape(encodeURIComponent(JSON.stringify({runId,passed:true,width:innerWidth,mode,checks:24}))));
 }catch(error){document.getElementById('result').textContent=btoa(unescape(encodeURIComponent(JSON.stringify({runId,passed:false,error:String(error),stack:error.stack}))))}
})();
</script>
