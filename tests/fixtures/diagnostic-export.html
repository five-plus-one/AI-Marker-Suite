<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>诊断包验收</title>
<body><pre id="result"></pre>
<script>
const storage = new Map(), menus = new Map(), now = Date.now();
const recent = now - 3600000, earlier = now - 10800000;
storage.set('ai-grading-history', JSON.stringify([
    { timestamp: recent, finalScore: 2, aiScore: 1.5, studentAnswer: 'private-student-answer',
        aiComment: 'private-comment', imageUrls: ['private-image-url'], subScores: [{ label: 'private-label', score: 2 }] },
    { timestamp: earlier, finalScore: 3, studentAnswer: 'older-student-answer' },
]));
storage.set('ai-grading-presets', JSON.stringify({
    active: 'default', list: { default: { apiKey: 'private-preset-secret', answer: 'private-reference-answer',
        endpoint: 'https://host.example/private-path?secret=private-token', scoring: { maxScore: 3, roundStep: 1 } } }, bindings: {},
}));
storage.set('ai-grading-providers-v2', JSON.stringify({
    providers: { 'private-provider-name': { apiKey: 'private-provider-key',
        endpoint: 'https://host.example/private-provider-path', models: { 'private-model-name': {} } } },
}));
for (const at of [recent, earlier]) {
    storage.set('ai-marker-diagnostic-log-v1-' + at + '-fixture-0', [{ at, level: 'warn', message: '练习日志' }]);
}
window.GM_getValue = (key, fallback) => storage.get(key) ?? fallback;
window.GM_setValue = (key, value) => storage.set(key, structuredClone(value));
window.GM_listValues = () => Array.from(storage.keys());
window.GM_deleteValue = key => storage.delete(key);
window.GM_setClipboard = value => { window.copiedReceipt = value; };
window.GM_registerMenuCommand = (name, handler) => menus.set(name, handler);
window.GM_xmlhttpRequest = () => ({ abort() {} });
</script>
<script src="../../dist/ai_marker.user.js"></script>
<script>
(async () => {
    const runId = new URLSearchParams(location.search).get('run'), checks = [];
    const check = (pass, label) => {
        checks.push({ pass: Boolean(pass), label });
        if (!pass) throw new Error(label);
    };
    let captured, filename;
    URL.createObjectURL = blob => { captured = blob; return 'blob:diagnostic-fixture'; };
    URL.revokeObjectURL = () => {};
    HTMLAnchorElement.prototype.click = function () { filename = this.download; };
    async function zipFiles() {
        const bytes = new Uint8Array(await captured.arrayBuffer());
        const view = new DataView(bytes.buffer), decoder = new TextDecoder(), files = {};
        for (let offset = 0; view.getUint32(offset, true) === 0x04034b50;) {
            const length = view.getUint32(offset + 18, true);
            const filenameLength = view.getUint16(offset + 26, true);
            const data = offset + 30 + filenameLength + view.getUint16(offset + 28, true);
            const name = decoder.decode(bytes.slice(offset + 30, offset + 30 + filenameLength));
            files[name] = JSON.parse(decoder.decode(bytes.slice(data, data + length)));
            offset = data + length;
        }
        return files;
    }
    const open = () => {
        menus.get('导出诊断包')();
        return document.querySelector('#ai-diagnostic-export');
    };
    const nextFrame = () => new Promise(resolve => requestAnimationFrame(resolve));
    try {
        let dialog = open(), form = dialog.querySelector('form');
        const box = dialog.getBoundingClientRect();
        check(dialog.open && Math.abs(box.left + box.right - innerWidth) < 3, '诊断弹窗居中');
        check(!dialog.querySelector('[data-diagnostic-range]').open, '默认收起自选时间');
        let start = form.elements.namedItem('start'), end = form.elements.namedItem('end');
        check(Date.parse(end.value) - Date.parse(start.value) === 7200000, '默认最近两小时');
        end.value = start.value;
        const validStart = start.value;
        start.value = '2099-01-01T00:00:00';
        form.requestSubmit();
        check(dialog.open && !captured && dialog.querySelector('[role=status]').textContent, '结束时间早于开始时间时提示');
        start.value = validStart;
        end.value = new Date(Date.parse(validStart) + 7200000 - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 19);
        form.requestSubmit();
        check(captured?.type === 'application/zip' && filename.endsWith('.zip'), '下载 ZIP 文件');
        let files = await zipFiles();
        check(files['阅卷记录.json'].length === 1 && files['阅卷记录.json'][0].finalScore === 2, '筛选两小时内阅卷记录');
        check(files['运行日志.json'].some(row => row.at === recent) && !files['运行日志.json'].some(row => row.at === earlier),
            '按同一时间筛选日志');
        check(files['运行日志.json'].some(row => row.message.includes('脚本版本')), '包含本次运行日志');
        check(files['配置摘要.json'].presets[0].scoring.maxScore === 3
            && files['配置摘要.json'].providers.some(provider => provider.keyConfigured) && !JSON.stringify(files).includes('private-'),
            '评分设置与结果可用于排查');
        await nextFrame();
        dialog = open();
        form = dialog.querySelector('form');
        form.elements.namedItem('start').value = new Date(earlier - 60000 - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 19);
        form.elements.namedItem('end').value = new Date(earlier + 60000 - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 19);
        form.requestSubmit();
        files = await zipFiles();
        check(files['阅卷记录.json'].length === 1 && files['阅卷记录.json'][0].finalScore === 3
            && files['运行日志.json'].length === 1 && files['运行日志.json'][0].at === earlier, '自选时间导出此前记录');
        await nextFrame();
        const pixel = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/z8pUbwAAAABJRU5ErkJggg==';
        const signedURL = 'https://example.test/paper.png?signature=fixture-private-signature';
        window.__AI_MARKER_ADAPTER__ = {
            id: 'eiduo', isMarkingPage: () => true, getPaperIdentity: () => 'fixture-paper',
            gatherAnswerImages: async () => [signedURL], fetchImageAsBase64: async url => url === signedURL ? pixel : null,
        };
        menus.get('上传诊断包')();
        dialog = document.querySelector('#ai-diagnostic-export');
        form = dialog.querySelector('form');
        form.requestSubmit();
        check(dialog.querySelector('[data-export-status]').textContent.includes('连接五加一账号'), '未登录即禁止上传');
        dialog.close();
        await nextFrame();
        storage.set('aimarker-diagnostic-upload-session', { token: 'fixture-upload-lease', expiresAt: Date.now() / 1000 + 60 });
        const attempts = [], attachments = [];
        const code = 'a'.repeat(40), url = 'https://tools.aimarking.five-plus-one.com/#diagnostic=' + code;
        window.GM_xmlhttpRequest = request => {
            check(request.url.startsWith('https://api.aimarking.five-plus-one.com/v1/diagnostics')
                && request.anonymous && request.headers.Authorization === 'Bearer fixture-upload-lease', '上传仅携带专用凭证');
            const data = JSON.parse(request.data);
            if (request.url.endsWith('/images')) {
                attachments.push(data);
                request.onload({ status: 201, finalUrl: request.url,
                    responseText: JSON.stringify({ record: data.record, position: data.position }) });
                return;
            }
            attempts.push(data);
            request.onload({ status: attempts.length === 1 ? 503 : 201, finalUrl: request.url,
                responseText: JSON.stringify({ receipt: data.id, code, url }) });
        };
        menus.get('上传诊断包')();
        dialog = document.querySelector('#ai-diagnostic-export');
        form = dialog.querySelector('form');
        check(!attachments.length && !attempts.length, '打开上传面板时不采集答卷或发送资料');
        form.elements.namedItem('description').value = '爱多分开始批改后暂停';
        form.requestSubmit();
        await nextFrame();
        check(dialog.open && attempts.length === 1 && attachments[0]?.bytes === pixel
            && attempts[0].attachments[0]?.record === -1 && attachments[0].id === attempts[0].id
            && attempts[0].description === '爱多分开始批改后暂停'
            && !JSON.stringify([attempts, attachments]).includes('fixture-private-signature')
            && !JSON.stringify(attempts[0]).includes('private-provider-key'), '默认上传答卷图片、描述与脱敏信息');
        form.requestSubmit();
        await nextFrame();
        check(attempts.length === 2 && attachments.length === 1 && attempts[0].id === attempts[1].id
            && !dialog.querySelector('[data-diagnostic-receipt]').hidden, '重试复用同一上传编号及已上传图片');
        dialog.querySelector('[data-diagnostic-copy]').click();
        check(window.copiedReceipt === '问题编号 ' + code + '\n' + url, '用户可复制完整编号与管理员查看网址');
    } catch (error) {
        checks.push({ pass: false, label: error.message });
    }
    const result = { runId, width: innerWidth, passed: checks.every(item => item.pass), checks };
    document.querySelector('#result').textContent = btoa(unescape(encodeURIComponent(JSON.stringify(result))));
})();
</script></html>
